<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>창업메이트 — 약관 및 정책</title>
<style>
  :root{--bg:#f6f7fb;--card:#fff;--text:#1c2033;--muted:#5c6480;--line:#e6e9f2;--brand:#6c5ce7}
  @media (prefers-color-scheme:dark){
    :root{--bg:#0a0b16;--card:#12142a;--text:#e9ebf7;--muted:#9aa3c4;--line:#242849;--brand:#8f7dff}
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;
    justify-content:center;padding:40px 24px;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR","Malgun Gothic",sans-serif}
  .wrap{max-width:520px;width:100%}
  .mark{width:72px;height:72px;border-radius:22px;display:flex;align-items:center;justify-content:center;
    font-size:38px;color:#fff;background:linear-gradient(135deg,#7b6cff,#5b8def);
    box-shadow:0 16px 40px rgba(108,92,231,.4);margin-bottom:22px}
  h1{font-size:27px;font-weight:800;letter-spacing:-.6px}
  p.sub{color:var(--muted);margin-top:9px;font-size:15px;line-height:1.7}
  .links{margin-top:28px;display:grid;gap:12px}
  a.item{display:flex;align-items:center;justify-content:space-between;gap:14px;text-decoration:none;
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:19px 22px;color:var(--text);
    transition:.15s}
  a.item:hover{border-color:var(--brand);transform:translateY(-1px)}
  a.item .t{font-weight:700;font-size:16px}
  a.item .d{color:var(--muted);font-size:13px;margin-top:3px}
  a.item .arrow{color:var(--brand);font-size:19px}
  footer{margin-top:26px;color:var(--muted);font-size:13px;line-height:1.7}
  footer a{color:var(--brand)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mark">✦</div>
  <h1>창업메이트 (StartMate)</h1>
  <p class="sub">AI 창업 코파일럿 · 약관 및 정책 문서</p>

  <div class="links">
    <a class="item" href="privacy.html">
      <span><span class="t">개인정보처리방침</span><span class="d" style="display:block">수집 항목 · AI 처리 · 보유 기간 · 이용자 권리</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="item" href="terms.html">
      <span><span class="t">이용약관</span><span class="d" style="display:block">서비스 내용 · 이용권 · 결제와 환불 · AI 결과물 특약</span></span>
      <span class="arrow">→</span>
    </a>
  </div>

  <footer>
    시행일자 2026년 7월 26일<br>
    문의 <a href="mailto:starmotor.dev2@gmail.com">starmotor.dev2@gmail.com</a>
  </footer>
</div>
</body>
</html>
